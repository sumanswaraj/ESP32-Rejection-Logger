name: Build All Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_version:
        description: 'Firmware version, for example 2.1.1; leave blank to use Config.h'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FIRMWARE_VERSION: ${{ inputs.firmware_version }}
    steps:
      - name: Get firmware source
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install saved Arduino CLI version
        shell: bash
        run: |
          set -euo pipefail
          cli_bin="$RUNNER_TEMP/arduino-cli-bin"
          mkdir -p "$cli_bin"
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            -o "$RUNNER_TEMP/install-arduino-cli.sh"
          BINDIR="$cli_bin" sh "$RUNNER_TEMP/install-arduino-cli.sh" 1.3.1
          echo "$cli_bin" >> "$GITHUB_PATH"
          "$cli_bin/arduino-cli" version

      - name: Restore downloaded tools and libraries
        uses: actions/cache@v5
        with:
          path: .toolchain
          key: esp32-toolchain-${{ runner.os }}-${{ hashFiles('toolchain.json') }}

      - name: Build and validate all 15 targets
        run: python build_all.py --setup --version "$FIRMWARE_VERSION"

      - name: Upload the firmware ZIP
        uses: actions/upload-artifact@v6
        with:
          name: ESP32-Firmware-${{ github.run_number }}
          path: |
            dist/ESP32_Firmware_*.zip
            dist/ESP32_Firmware_*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Show download instructions
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          packages = sorted(Path('dist').glob('*.zip'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('All 15 firmware targets passed validation.\n\n')
              summary.write('Download **ESP32-Firmware-' + os.environ['GITHUB_RUN_NUMBER'] + '** from Artifacts below.\n\n')
              summary.write('Extract the downloaded artifact ZIP once, then import **' + packages[0].name + '** in the flashing app.\n')
          PY
